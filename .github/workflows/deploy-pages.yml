name: Publish public wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wedding-invitation-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate invitation artwork
        run: |
          for file in assets/jv-emblem.png assets/couple.webp assets/ganpati.png assets/nashik-real.webp assets/reception-map-qr.png assets/favicon.png assets/social-preview.jpg; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required original wedding invitation artwork is missing"
              exit 1
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload invitation
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
