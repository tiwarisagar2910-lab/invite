name: Publish public wedding invitation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wedding-invitation-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate invitation artwork
        run: |
          for file in assets/jv-emblem.png assets/couple.webp assets/ganpati.png assets/nashik-real.webp assets/reception-map-qr.png assets/favicon.png assets/social-preview.jpg; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Required original wedding invitation artwork is missing"
              exit 1
            fi
          done
      - name: Check JavaScript and soundtrack assets
        run: |
          node --check app.js
          for file in assets/mangal-rang-envelope-intro.mp3 assets/shehnai-ambient-loop.mp3; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Wedding soundtrack asset is missing"
              exit 1
            fi
          done
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload invitation
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public invitation and guest-facing short link
        if: always()
        shell: bash
        run: |
          echo '=== Direct GitHub Pages invitation ==='
          curl --location --silent --show-error --max-time 20 --output /tmp/direct-page.html --write-out 'Direct HTTP=%{http_code} final_url=%{url_effective} content_type=%{content_type}\n' 'https://tiwarisagar2910-lab.github.io/invite/' || true
          echo '=== TinyURL guest link ==='
          curl --location --silent --show-error --max-time 20 --output /tmp/short-page.html --write-out 'Short HTTP=%{http_code} final_url=%{url_effective} content_type=%{content_type}\n' 'https://tinyurl.com/jyotisangvaibhav' || true
          echo '=== Page title from direct link ==='
          grep -Eo '<title>[^<]*</title>' /tmp/direct-page.html | head -1 || true
          echo '=== Music assets served by GitHub Pages ==='
          for asset in mangal-rang-envelope-intro.mp3 shehnai-ambient-loop.mp3; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --max-time 25 \
              --output /dev/null \
              --write-out "Audio $asset HTTP=%{http_code} content_type=%{content_type} size=%{size_download}\n" \
              "https://tiwarisagar2910-lab.github.io/invite/assets/$asset"
          done
